services:
  - type: web
    name: anwara-memorial-hospital
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: anwara_hospital
      - key: APP_TZ
        value: Asia/Dhaka
      - key: SESSION_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Anwara Hospital Admin
